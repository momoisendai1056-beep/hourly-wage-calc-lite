<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時給計算LITE 〜深夜・残業代も1秒でわかる〜</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f6f9; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .phone-container { width: 100%; max-width: 412px; min-height: 100vh; background: #f8f9fa; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .main-content { padding: 16px; display: flex; flex-direction: column; gap: 16px; flex-grow: 1; justify-content: center; }
        .summary-box { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 20px; border-radius: 16px; text-align: center; }
        .summary-amount { font-size: 32px; font-weight: bold; margin: 5px 0; }
        .summary-details { display: flex; justify-content: space-around; margin-top: 15px; font-size: 12px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 10px; }
        .input-box { background: white; border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 12px; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #dee2e6; border-radius: 8px; box-sizing: border-box; font-size: 15px; background: #f8f9fa; }
        button { width: 100%; background: #1a73e8; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .ad-space { text-align: center; margin: 15px 0; min-height: 50px; display: flex; justify-content: center; align-items: center; }
        .footer-info { font-size: 10px; color: #aaa; text-align: center; padding: 15px; background: #f1f3f5; }
    </style>
</head>
<body>
<div class="phone-container">
    <div class="main-content">
        <div class="summary-box">
            <div>本日の想定入金額</div>
            <div class="summary-amount" id="summary-total">0 円</div>
            <div class="summary-details">
                <div>実働: <span id="summary-hours">0.0</span>h</div>
                <div>深夜: <span id="summary-midnight">0.0</span>h</div>
                <div>残業: <span id="summary-over">0.0</span>h</div>
            </div>
        </div>
        <div class="input-box">
            <div class="form-group"><label>基本時給 (円)</label><input type="number" id="hourly-wage" value="1200"></div>
            <div style="display:flex; gap:8px;">
                <div class="form-group" style="flex:1;"><label>勤務開始</label><input type="time" id="start-time" value="17:00"></div>
                <div class="form-group" style="flex:1;"><label>勤務終了</label><input type="time" id="end-time" value="23:30"></div>
            </div>
            <button onclick="calculateDailySalary()">計算する</button>
        </div>
        <!-- 広告コード修正箇所 -->
        <div class="ad-space">
            <script src="https://shinobi.jp"></script>
        </div>
    </div>
    <div class="footer-info">※計算結果は概算です。当サイトは広告を掲載しています。</div>
</div>
<script>
    function calculateDailySalary() {
        const wage = parseFloat(document.getElementById('hourly-wage').value) || 0;
        const start = document.getElementById('start-time').value;
        const end = document.getElementById('end-time').value;
        if (!start || !end) return;
        const parseMin = (t) => { const [h,m] = t.split(':').map(Number); return h*60+m; };
        let sMin = parseMin(start), eMin = parseMin(end);
        if (eMin < sMin) eMin += 24*60;
        let workMin = eMin - sMin;
        let dayPay = (workMin/60)*wage;
        document.getElementById('summary-total').innerText = Math.round(dayPay).toLocaleString() + " 円";
        document.getElementById('summary-hours').innerText = (workMin/60).toFixed(1);
    }
</script>
</body>
</html>
