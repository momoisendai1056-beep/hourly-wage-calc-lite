<script>
window.addEventListener('DOMContentLoaded', () => {

    calculateDailySalary();

    setTimeout(() => {
        const splash = document.getElementById('splash-screen');

        if (splash) {
            splash.style.opacity = '0';

            setTimeout(() => {
                splash.style.display = 'none';
            }, 500);
        }
    }, 2500);

});


function calculateDailySalary() {

    const wage =
        parseFloat(document.getElementById('hourly-wage').value) || 0;

    const start =
        document.getElementById('start-time').value;

    const end =
        document.getElementById('end-time').value;

    const bStart =
        document.getElementById('break-start').value;

    const bEnd =
        document.getElementById('break-end').value;

    if (!start || !end) {
        return;
    }

    const parseMin = (t) => {
        const [h, m] = t.split(':').map(Number);
        return h * 60 + m;
    };

    let sMin = parseMin(start);
    let eMin = parseMin(end);

    if (eMin <= sMin) {
        eMin += 24 * 60;
    }

    let bsMin = null;
    let beMin = null;

    if (bStart && bEnd) {

        bsMin = parseMin(bStart);
        beMin = parseMin(bEnd);

        if (bsMin < sMin) {
            bsMin += 24 * 60;
        }

        if (beMin <= bsMin) {
            beMin += 24 * 60;
        }
    }

    let workMin = 0;
    let midnightMin = 0;
    let overtimeMin = 0;
    let midnightOverMin = 0;

    for (let m = sMin; m < eMin; m++) {

        const isBreak =
            bsMin !== null &&
            beMin !== null &&
            m >= bsMin &&
            m < beMin;

        if (isBreak) {
            continue;
        }

        const workedBefore = workMin;

        workMin++;

        const minuteOfDay = m % (24 * 60);

        const isMidnight =
            minuteOfDay >= 22 * 60 ||
            minuteOfDay < 5 * 60;

        const isOvertime =
            workedBefore >= 8 * 60;

        if (isMidnight) {
            midnightMin++;
        }

        if (isOvertime) {
            overtimeMin++;
        }

        if (isMidnight && isOvertime) {
            midnightOverMin++;
        }
    }

    const basePay =
        (workMin / 60) * wage;

    const midnightPay =
        (midnightMin / 60) * wage * 0.25;

    const overtimePay =
        (overtimeMin / 60) * wage * 0.25;

    const midnightOverPay =
        (midnightOverMin / 60) * wage * 0.25;

    const totalPay =
        basePay +
        midnightPay +
        overtimePay +
        midnightOverPay;

    document.getElementById('summary-total').innerText =
        Math.round(totalPay).toLocaleString() + " 円";

    document.getElementById('summary-hours').innerText =
        (workMin / 60).toFixed(1);

    document.getElementById('summary-midnight').innerText =
        (midnightMin / 60).toFixed(1);

    document.getElementById('summary-over').innerText =
        (overtimeMin / 60).toFixed(1);
}
</script>
